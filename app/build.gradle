plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.latin.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.latin.keyboard'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

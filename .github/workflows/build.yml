name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: klaviatura-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zafron-apk
          path: zafron/build/outputs/apk/debug/zafron-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk klaviatura.apk
          cp zafron/build/outputs/apk/debug/zafron-debug.apk zafron.apk
          gh release delete v1 --yes --cleanup-tag || true
          gh release create v1 klaviatura.apk zafron.apk --title "Klaviatura APK" --notes "O'zbek lotin klaviaturasi (ş ç ö ğ)"

  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zafron-apk
          path: .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash ci/smoke.sh
      - name: Publish results
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@example.com"
          rm -f ci-out/u.xml
          git add ci-out || true
          git commit -m "CI smoke results [skip ci]" || exit 0
          git pull --rebase origin main
          git push

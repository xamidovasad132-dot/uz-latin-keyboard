name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: klaviatura-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk klaviatura.apk
          cp zafron/build/outputs/apk/debug/zafron-debug.apk zafron.apk
          gh release delete v1 --yes --cleanup-tag || true
          gh release create v1 klaviatura.apk zafron.apk --title "Klaviatura APK" --notes "O'zbek lotin klaviaturasi (ş ç ö ğ)"
